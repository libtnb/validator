name: Test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        platform: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: go.mod
      - name: Install dependencies
        run: go mod tidy
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - run: go test -race ./...
      - name: Benchmarks (smoke)
        run: go test -run '^$' -bench=. -benchmem ./...
      - name: DSL fuzz (short)
        run: |
          go test -run '^$' -fuzz=FuzzParse -fuzztime=30s .
          go test -run '^$' -fuzz=FuzzSplitDive -fuzztime=30s ./internal/dsl/
  contrib:
    strategy:
      matrix:
        module: [ contrib/openapi, contrib/gormrules ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          cache-dependency-path: |
            go.sum
            ${{ matrix.module }}/go.sum
          go-version-file: go.mod
      - name: Create local workspace
        run: go work init . "${{ matrix.module }}"
      - name: Verify module
        working-directory: ${{ matrix.module }}
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test -race ./...
